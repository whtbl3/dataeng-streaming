name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - uses: hashicorp/setup-terraform@v3
      - name: Install
        run: make install
      - name: Check (same as local `make check`)
        run: make check

  # End-to-end tests against the full Docker stack. Manual trigger only (heavy).
  e2e:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11 && make install
      - run: make up
      - run: make e2e
      - if: always()
        run: docker compose -f infra/local/docker-compose.yml logs --tail=200
