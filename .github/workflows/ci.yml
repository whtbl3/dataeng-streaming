name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.11
      - uses: hashicorp/setup-terraform@v3
      - name: Install
        run: make install
      - name: Check (same as local `make check`)
        run: make check
      - name: dbt unit tests and SQL lint on a throwaway Trino (spec 007 AC11)
        run: make dbt-ci

  # End-to-end tests against the full Docker stack. Manual trigger only (heavy).
  e2e:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.11 && make install
      # MinIO comes from Docker Hardened Images (dhi.io), which needs a Docker Hub login.
      # Repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (read-only access token).
      - uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Start stack (AC1 - healthy within 5 minutes)
        run: timeout 300 make up
      - run: make e2e
      - run: make e2e-restart
      - if: always()
        run: docker compose -f infra/local/docker-compose.yml --profile cdc --profile jobs logs --tail=200
      - name: make clean leaves no replication slot behind (spec 002 AC8)
        run: |
          make clean
          test -z "$(docker volume ls -q --filter name=control-tower_postgres-data)"
