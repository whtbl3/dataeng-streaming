# Local core stack (ADR 0005): Redpanda → Flink → Iceberg (REST catalog, S3 on MinIO) → Trino.
# Every setting has a default, so no .env is needed; override via env or a .env file.
name: control-tower

x-s3-env: &s3-env
  S3_ENDPOINT: ${S3_ENDPOINT_INTERNAL:-http://minio:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-ct-local}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-ct-local-secret}
  AWS_REGION: ${LOCAL_S3_REGION:-us-east-1}
  WAREHOUSE: ${WAREHOUSE:-s3://warehouse/}
  ICEBERG_CATALOG_URI: http://iceberg-rest:8181

x-flink-props: &flink-props |
  jobmanager.rpc.address: jobmanager
  rest.address: jobmanager
  parallelism.default: 1
  # 7 slots: 2 GPS jobs x GPS_PARALLELISM (2) + 2 order jobs + control tower. No trailing comments here.
  taskmanager.numberOfTaskSlots: 7
  # Keyed state (dedup, latest version) lives on disk in RocksDB, so its size is not capped by heap,
  # and each checkpoint uploads only the files that changed (spec 005).
  state.backend.type: rocksdb
  execution.checkpointing.incremental: true
  execution.checkpointing.num-retained: 2
  execution.checkpointing.dir: file:///opt/flink/checkpoints
  execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
  jobmanager.memory.process.size: 900m
  taskmanager.memory.process.size: 2400m

services:
  # ---- Object storage (S3 API) -------------------------------------------------
  minio:
    image: ${S3_IMAGE:-dhi.io/minio:RELEASE.2025-09-07T16-13-09Z-debian13}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-ct-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-ct-local-secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["s3-data:/data"]
    mem_limit: 512m

  minio-init: # creates the warehouse bucket; doubles as MinIO's readiness gate (image has no shell)
    image: amazon/aws-cli:2.39.4
    depends_on: [minio]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-ct-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-ct-local-secret}
      AWS_DEFAULT_REGION: ${LOCAL_S3_REGION:-us-east-1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 60); do
          aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1 && break
          sleep 1
        done
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket warehouse 2>/dev/null \
          || aws --endpoint-url http://minio:9000 s3 mb s3://warehouse

  # ---- Order database (CDC source, ADR 0004) --------------------------------------
  postgres: # order OLTP (CDC source) and the serving tables (spec 006), so it is in the core stack
    image: postgres:16.15
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - max_slot_wal_keep_size=1GB # an abandoned slot cannot fill the disk
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-control_tower}
      POSTGRES_USER: ${POSTGRES_USER:-ct}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ct-local}
    ports: ["${POSTGRES_HOST_PORT:-15432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m

  # ---- Kafka API ------------------------------------------------------------------
  redpanda:
    image: redpandadata/redpanda:v26.1.20
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=640M
      - --reserve-memory=0M
      - --overprovisioned
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports: ["19092:19092", "18081:18081", "19644:9644"]
    volumes: ["redpanda-data:/var/lib/redpanda/data"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1g

  redpanda-init: # idempotent: topics + dead-letter topics, compatibility mode, GPS schemas
    image: redpandadata/redpanda:v26.1.20
    depends_on:
      redpanda: { condition: service_healthy }
    volumes:
      - ../../schemas:/schemas:ro
      - ./redpanda/init.sh:/init.sh:ro
    environment:
      GPS_TOPIC: ${GPS_TOPIC:-gps.pings.v1}
    entrypoint: ["/bin/bash", "/init.sh"]

  # ---- CDC: Kafka Connect + Debezium (ADR 0004) -----------------------------------
  connect:
    build: ./connect # Debezium 3.6.3 + Confluent Avro converter
    image: control-tower/connect:3.6.3
    profiles: ["cdc"]
    depends_on:
      redpanda-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: ct-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      HEAP_OPTS: -Xms256m -Xmx512m
      # connector configs use $${env:...}, so no credentials live in the JSON file
      CONNECT_PRODUCER_COMPRESSION_TYPE: zstd # batches to cdc.* topics are compressed (spec 005)
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      POSTGRES_USER: ${POSTGRES_USER:-ct}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ct-local}
      POSTGRES_DB: ${POSTGRES_DB:-control_tower}
    ports: ["8083:8083"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/connectors"]
      interval: 5s
      timeout: 5s
      retries: 60
    mem_limit: 1g

  connect-init: # idempotent: PUT creates or updates the connector, then waits for RUNNING
    image: quay.io/debezium/connect:3.6.3.Final
    profiles: ["cdc"]
    depends_on:
      connect: { condition: service_healthy }
    volumes: ["./connect:/config:ro"]
    entrypoint: ["/bin/bash", "/config/register.sh"]

  serving-init: # idempotent: serving schema and tables for the control tower (spec 006, ADR 0007)
    image: postgres:16.15
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-ct}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ct-local}
      PGDATABASE: ${POSTGRES_DB:-control_tower}
    volumes: ["./postgres/serving.sql:/serving.sql:ro"]
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-f", "/serving.sql"]

  # ---- Iceberg catalog ------------------------------------------------------------
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      minio-init: { condition: service_completed_successfully }
    environment:
      CATALOG_WAREHOUSE: ${WAREHOUSE:-s3://warehouse/}
      CATALOG_URI: jdbc:sqlite:file:/home/iceberg/catalog.db?busy_timeout=30000
      # One JDBC connection: with the default pool of 2, a connection that just read holds a
      # stale SQLite snapshot, and its next commit fails with SQLITE_BUSY_SNAPSHOT (HTTP 500).
      # Five Flink committers + Trino hit this constantly (spec 003). Requests now serialize.
      CATALOG_CLIENTS: "1"
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: iceberg
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: ${S3_ENDPOINT_INTERNAL:-http://minio:9000}
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-ct-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-ct-local-secret}
      AWS_REGION: ${LOCAL_S3_REGION:-us-east-1}
    ports: ["8181:8181"]
    volumes: ["iceberg-catalog:/home/iceberg"]
    mem_limit: 512m

  # ---- SQL ------------------------------------------------------------------------
  trino:
    image: trinodb/trino:484
    depends_on: [iceberg-rest]
    environment: *s3-env
    ports: ["8080:8080"]
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro # default jvm.config sizes heap to 80% of mem_limit
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      timeout: 5s
      retries: 60
    mem_limit: 1536m

  trino-init:
    image: trinodb/trino:484
    depends_on:
      trino: { condition: service_healthy }
    volumes: ["./trino/init:/init:ro"]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        for f in /init/*.sql; do
          echo "applying $$f"
          trino --server http://trino:8080 --file "$$f" || exit 1
        done

  # ---- Table maintenance (spec 005, ADR 0012) ------------------------------------------
  maintenance: # compaction, manifests, snapshot expiry, orphan files, retention; through Trino
    image: python:3.11.11-slim
    depends_on:
      trino-init: { condition: service_completed_successfully }
    environment:
      TRINO_URL: http://trino:8080
      SNAPSHOT_RETENTION: ${SNAPSHOT_RETENTION:-7d}
      ORPHAN_RETENTION: ${ORPHAN_RETENTION:-7d}
    volumes: ["./maintenance:/opt/maintenance:ro"]
    entrypoint: ["python", "-u", "/opt/maintenance/maintain.py"]
    mem_limit: 64m

  # ---- Gold (spec 007, ADR 0014) ------------------------------------------------------
  dbt: # gold star schema: intraday build every 5 min, nightly close at 01:00 local (ADR 0006)
    build: ./dbt
    image: control-tower/dbt:1.11.16
    depends_on:
      trino-init: { condition: service_completed_successfully }
    environment:
      DBT_TRINO_HOST: trino
      DBT_TRINO_PORT: "8080"
      GOLD_INTERVAL_MIN: ${GOLD_INTERVAL_MIN:-5}
      GOLD_CLOSE_AT: ${GOLD_CLOSE_AT:-01:00}
    volumes: ["../../dbt:/opt/dbt:ro"]
    mem_limit: 512m

  # ---- Flink ----------------------------------------------------------------------
  jobmanager:
    build: ./flink
    image: control-tower/flink:1.20.5
    command: jobmanager
    # Without HA, a JobManager that shuts down cleanly (SIGTERM: `docker stop`, a reboot) suspends
    # its jobs and deletes their retained checkpoints, so nothing could resume. Killing it keeps
    # them (spec 005 AC4). `make down` still stops every job with a savepoint first.
    stop_signal: SIGKILL
    environment:
      FLINK_PROPERTIES: *flink-props
    ports: ["8081:8081"]
    volumes: ["flink-checkpoints:/opt/flink/checkpoints"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/overview"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1g

  taskmanager:
    image: control-tower/flink:1.20.5
    depends_on:
      jobmanager: { condition: service_healthy }
    command: taskmanager
    environment:
      FLINK_PROPERTIES: *flink-props
    volumes: ["flink-checkpoints:/opt/flink/checkpoints"]
    mem_limit: 2560m # JVM + RocksDB + one Python UDF worker per GPS subtask and CDC job (ADR 0010)

  flink-submit: # one-shot, idempotent; run by `make up` via `docker compose run`
    image: control-tower/flink:1.20.5
    profiles: ["jobs"]
    depends_on:
      taskmanager: { condition: service_started }
      jobmanager: { condition: service_healthy }
      redpanda-init: { condition: service_completed_successfully }
      trino-init: { condition: service_completed_successfully }
      serving-init: { condition: service_completed_successfully }
    environment:
      <<: *s3-env
      FLINK_PROPERTIES: *flink-props
      SERVING_JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-control_tower}
      SERVING_USER: ${POSTGRES_USER:-ct}
      SERVING_PASSWORD: ${POSTGRES_PASSWORD:-ct-local}
      ALERTS_TOPIC: alerts.v1
      KAFKA_BOOTSTRAP: redpanda:9092
      GPS_TOPIC: ${GPS_TOPIC:-gps.pings.v1}
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      CHECKPOINT_INTERVAL: ${CHECKPOINT_INTERVAL:-30 s}
      GPS_PARALLELISM: ${GPS_PARALLELISM:-2}
      SNAPSHOT_RETENTION: ${SNAPSHOT_RETENTION:-7d} # same as maintenance: how long a reader may stop
      FRESH_JOBS: ${FRESH_JOBS:-}
    volumes:
      - ../../flink/jobs:/opt/flink/jobs:ro
      - ../../contracts:/opt/ct/contracts:ro # shipped to the cluster via python.files
      - ../../schemas:/opt/ct/schemas:ro
      - ../../flink:/opt/ct/flink:ro # flink.udf (control tower rules) and the Python job
      - ./iceberg:/opt/iceberg:ro
      - flink-checkpoints:/opt/flink/checkpoints # savepoint pointers (stop_jobs.sh / submit.sh)
    entrypoint: ["/bin/bash", "-c"]
    # Trino creates the tables but cannot set identifier fields (the upsert key) or write.* properties
    # (hash distribution, metadata cleanup), so table_admin.py sets them first (ADR 0011, spec 005).
    command:
      - >-
        python /opt/iceberg/table_admin.py "$$ICEBERG_CATALOG_URI" apply &&
        /opt/flink/bin/submit.sh /opt/flink/jobs/bronze_gps.sql bronze_gps &&
        /opt/flink/bin/submit.sh /opt/flink/jobs/bronze_cdc.sql bronze_cdc &&
        /opt/flink/bin/submit.sh /opt/flink/jobs/silver_gps.sql silver_gps &&
        /opt/flink/bin/submit.sh /opt/flink/jobs/silver_orders.sql silver_orders &&
        /opt/flink/bin/submit.sh /opt/ct/flink/jobs/control_tower.py control_tower

volumes:
  postgres-data:
  s3-data:
  redpanda-data:
  iceberg-catalog:
  flink-checkpoints:
