<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control Tower Design Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one working screen. Header (stage, arch view) · left timeline of business events ·
   centre workspace: problem → decision → synchronized panes → architecture → Learn/Explore/Build.
   Inspector drawer on the right opens only for a selected component. */
:root {
  --bg: #f4f7fd; --paper: #ffffff; --sunk: #edf2fb; --ink: #0f2350; --soft: #40507a; --faint: #7887a8; --line: #d5e1f5;
  --accent: #2f6fde; --accent-ink: #1e4fb8; --accent-bg: #e5eeff; --on-accent: #ffffff; --teal: #1890d8; --teal-bg: #e0f1fc;
  --impl: #1f8a50; --impl-bg: #e3f4ea; --des: #5d6b8a; --des-bg: #e9edf5; --bad: #c43a35; --bad-bg: #fce7e5; --warn: #9a5b00; --warn-bg: #fbeedb;
  --code: #f6f9ff; --chg: #fff2bf; --new: #e2f5ea; --hero-mid: #dce8ff; --hero-end: #8db1f4; --depth: #9dbdf6; --band: rgba(255,255,255,.34); --blue-deep: #2c55b9; --blue-mid: #3f6fd6; color-scheme: light;
  --f-d: "Lexend", "Segoe UI", system-ui, sans-serif; --f-b: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif; --f-m: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: linear-gradient(115deg, #ffffff 0%, #f6f9ff 48%, #e6efff 72%, #cfdffc 100%) fixed var(--bg); color: var(--ink); font: 15px/1.6 var(--f-b); }
h1, h2, h3, h4 { font-family: var(--f-d); margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
code { font: 500 .86em var(--f-m); background: var(--sunk); border-radius: 5px; padding: 1px 5px; overflow-wrap: anywhere; }
pre { margin: 0; font: 12.5px/1.6 var(--f-m); background: var(--code); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; white-space: pre; }
pre .c { color: var(--faint); } pre .k { color: var(--teal); font-weight: 600; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* header */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
.brand { display: grid; line-height: 1.25; } .brand b { font: 800 16px var(--f-d); } .brand span { font-size: 12px; color: var(--faint); }
.where { display: grid; gap: 2px; margin-right: auto; min-width: 0; }
.where .lbl { font: 600 11px var(--f-b); letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); }
.where .stg { font: 700 15px var(--f-d); }
.dots { display: flex; gap: 4px; } .dots i { width: 22px; height: 5px; border-radius: 3px; background: var(--line); }
.dots i.done { background: #9cbcf6; } .dots i.cur { background: var(--accent); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; background: var(--sunk); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--soft); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.seg-lbl { font-size: 11px; color: var(--faint); letter-spacing: .06em; text-transform: uppercase; margin-right: 4px; }
.ctrl { display: flex; align-items: center; gap: 4px; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 9px; padding: 8px 14px; cursor: pointer; font-size: 14px; font-weight: 600; }
.btn.primary { background: var(--accent); color: #ffffff; border-color: var(--accent); }
.btn.accent { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.linkbtn { border: 0; background: none; color: var(--teal); cursor: pointer; padding: 0; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* app */
.app { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: calc(100vh - 60px); }
.tl { border-right: 1px solid var(--line); background: var(--paper); padding: 18px 16px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; align-content: start; position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto; }
.tl h4 { font: 600 11px var(--f-b); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); margin-bottom: 8px; }
.stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.stages button { width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 6px 8px; cursor: pointer; display: grid; grid-template-columns: 1.6em minmax(0, 1fr); gap: 4px; font-size: 13.5px; line-height: 1.35; color: var(--soft); }
.stages button .n { font: 600 12px/1.6 var(--f-m); color: var(--faint); }
.stages button.done .n { color: var(--teal); }
.stages button[aria-current="true"] { background: var(--accent); color: #ffffff; } .stages button[aria-current="true"] .n { color: #dbe7ff; }
.events { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.events li { display: grid; grid-template-columns: 4.2em 14px minmax(0, 1fr); gap: 6px; font-size: 13px; line-height: 1.4; }
.events time { font: 500 11.5px/1.5 var(--f-m); color: var(--faint); text-align: right; }
.events .rl { position: relative; } .events .rl::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.events .rl::after { content: ""; position: absolute; left: 2px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--teal); }
.events li.now .rl::after { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.events li.future { opacity: .45; } .events li.future .rl::after { background: var(--line); }
.events li span.t { padding-bottom: 10px; }
.player { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; background: var(--sunk); border-radius: 12px; padding: 12px; }
.player p { font-size: 13px; color: var(--soft); }
.player .row { display: flex; gap: 6px; flex-wrap: wrap; }
main.ws { min-width: 0; padding: 22px max(16px, 2.4vw) 80px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-content: start; max-width: 1240px; }

/* problem + decision */
.problem { display: grid; gap: 8px; padding: 24px 28px 26px; border-radius: 18px; border: 1px solid var(--line); position: relative; overflow: hidden;
  background: linear-gradient(112deg, #ffffff 0 47%, #dbe7ff 57%, #9cbcf6 70%, var(--blue-mid) 84%, var(--blue-deep) 100%); }
.problem > * { position: relative; z-index: 1; }
.problem::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 34%; z-index: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,.55) 1.3px, transparent 1.7px); background-size: 16px 16px;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 40%); mask-image: linear-gradient(90deg, transparent, #000 40%); }
@media (max-width: 700px) { .problem { background: linear-gradient(160deg, #ffffff 0 62%, #dbe7ff 78%, #9cbcf6 100%); } .problem::after { display: none; } }
.problem .k { font: 600 11.5px var(--f-b); letter-spacing: .12em; text-transform: uppercase; color: var(--accent-ink); }
.problem h2 { font-size: clamp(22px, 2.6vw, 31px); font-weight: 700; letter-spacing: -.015em; max-width: 30ch; color: var(--ink); }
.problem p { color: var(--soft); max-width: 62ch; font-size: 15.5px; }
.decision { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.decision .q { font: 700 16px var(--f-d); }
.opts { display: grid; gap: 6px; }
.opt { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; background: var(--paper); text-align: left; }
.opt input { margin: 3px 0 0; accent-color: var(--accent); }
.opt b { font-weight: 600; } .opt span.s { display: block; font-size: 13px; color: var(--soft); }
.opt.right { border-color: var(--impl); background: var(--impl-bg); } .opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.fb { font-size: 14px; border-radius: 10px; padding: 10px 12px; } .fb.ok { background: var(--impl-bg); } .fb.no { background: var(--bad-bg); }
.reqs { display: flex; flex-wrap: wrap; gap: 6px; }
.req { font-size: 12.5px; background: var(--teal-bg); color: var(--ink); border-radius: 8px; padding: 4px 9px; }
.req b { color: var(--teal); }

/* panes */
.panes { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.pane { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 6px 18px -10px var(--depth); padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; align-content: start; min-width: 0; position: relative; }
.pane.wide { grid-column: 1 / -1; }
.pane.flash { animation: flash 1.1s ease; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .pane.flash { animation: none; } }
.pane h3 { font: 700 13.5px var(--f-b); display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.pane h3 small { font: 500 11.5px var(--f-m); color: var(--faint); }
.pane h3 button.insp-open { margin-left: auto; border: 0; background: none; color: var(--teal); font-size: 12px; font-weight: 600; cursor: pointer; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--faint); } .kv dd { margin: 0; font: 500 12.5px var(--f-m); overflow-wrap: anywhere; }
.kv dd.chg { background: var(--chg); border-radius: 4px; padding: 0 4px; }
.mt { border-collapse: collapse; width: 100%; font: 12px/1.45 var(--f-m); }
.mt th, .mt td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
.mt th { font: 600 10.5px var(--f-b); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); white-space: nowrap; overflow-wrap: normal; }
.mt tr.new td { background: var(--new); } .mt tr.dup td { background: var(--bad-bg); }
.note { font-size: 12.5px; color: var(--soft); }
.st { display: inline-flex; align-items: center; gap: 4px; font: 600 10.5px/1 var(--f-b); padding: 3px 7px; border-radius: 999px; white-space: nowrap; letter-spacing: 0; text-transform: none; }
.st::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.st.impl { color: var(--impl); background: var(--impl-bg); } .st.des { color: var(--des); background: var(--des-bg); } .st.prop, .st.ex { color: var(--warn); background: var(--warn-bg); }
.st.ex { background: transparent; border: 1px dashed var(--warn); }
.status-line { font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { font: 600 11.5px var(--f-m); padding: 3px 8px; border-radius: 6px; background: var(--sunk); }
.pill.wait { background: var(--warn-bg); color: var(--warn); } .pill.ok { background: var(--impl-bg); color: var(--impl); }
.map svg { display: block; width: 100%; height: auto; }
.map .road { stroke: var(--line); stroke-width: 2; stroke-dasharray: 5 5; }
.map .dep { fill: var(--ink); } .map .dst { fill: var(--accent); } .map .van { fill: var(--teal); }
.map .ring { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 3 3; }
.map text { fill: var(--soft); font: 500 11px var(--f-b); }
.erd { overflow-x: auto; } .erd svg { display: block; width: 100%; min-width: 760px; height: auto; }
.et rect.box { fill: var(--paper); stroke: var(--line); stroke-width: 1.5; } .et rect.hd { fill: var(--sunk); }
.et text { fill: var(--ink); font: 500 12px var(--f-m); } .et text.tn { font: 700 13.5px var(--f-m); }
.et text.ty { fill: var(--faint); font: 400 10.5px var(--f-m); } .et text.tg { fill: var(--teal); font: 600 9.5px var(--f-m); } .et text.tg.pk { fill: var(--accent-ink); }
.et rect.newrow { fill: var(--new); }
.et { cursor: pointer; } .et:focus { outline: none; } .et:hover rect.box, .et:focus rect.box { stroke: var(--teal); }
.rel { stroke: var(--soft); stroke-width: 1.5; fill: none; } .rel-c { fill: var(--paper); stroke: var(--soft); stroke-width: 1.5; }
.rel-l { fill: var(--soft); font: 500 11px var(--f-b); }

/* architecture */
.arch { background: linear-gradient(112deg, #ffffff 0 22%, #e2ecff 40%, #a7c4f7 62%, var(--blue-mid) 82%, var(--blue-deep) 100%); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.arch-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; justify-content: space-between; }
.arch-head h3 { font: 700 13.5px var(--f-b); }
.arch-svg { overflow-x: auto; } .arch-svg svg { display: block; width: 100%; min-width: 820px; height: auto; }
.band { fill: var(--band); stroke: rgba(255,255,255,.55); } .bandl { fill: var(--ink); font: 600 10.5px var(--f-b); letter-spacing: .12em; text-transform: uppercase; } .bandl.on { fill: #ffffff; }
.an rect { fill: #ffffff; stroke: var(--blue-mid); stroke-width: 1.6; filter: drop-shadow(0 5px 0 var(--depth)); }
.an.impl rect { stroke: var(--blue-mid); } .an.des rect { fill: rgba(255,255,255,.82); stroke: var(--blue-mid); stroke-dasharray: 5 4; filter: none; }
.an.hot rect { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 2.4; stroke-dasharray: none; filter: drop-shadow(0 5px 0 var(--accent)); }
.an text.t { fill: var(--ink); font: 700 12.5px var(--f-b); } .an text.s { fill: var(--soft); font: 500 10.5px var(--f-m); }
.an { cursor: pointer; } .an:focus { outline: none; } .an:hover rect, .an:focus rect { fill: var(--teal-bg); }
.ae-halo { stroke: rgba(255,255,255,.85); stroke-width: 4.5; fill: none; } .ae { stroke: var(--blue-deep); stroke-width: 1.6; fill: none; } .ae.hot { stroke: var(--accent); stroke-width: 2.6; }
.ae.dash { stroke-dasharray: 5 4; }
.ael { fill: var(--ink); font: 500 10.5px var(--f-m); paint-order: stroke; stroke: #ffffff; stroke-width: 3px; } .ael.hot { fill: var(--accent-ink); font-weight: 600; }
#mk path { fill: var(--blue-deep); } #mkh path { fill: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--soft); }
.arch .legend { background: rgba(255,255,255,.9); padding: 4px 12px; border-radius: 999px; color: var(--ink); }
.legend i { display: inline-block; width: 18px; height: 10px; border-radius: 3px; border: 1.5px solid; margin-right: 5px; vertical-align: -1px; }

/* modes */
.modes { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; display: grid; grid-template-columns: minmax(0, 1fr); }
.modes-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); padding: 0 8px; overflow-x: auto; }
.modes-tabs button { border: 0; background: none; padding: 12px 14px 10px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--soft); border-bottom: 2.5px solid transparent; display: grid; text-align: left; gap: 1px; white-space: nowrap; }
.modes-tabs button small { font-weight: 400; font-size: 11.5px; color: var(--faint); }
.modes-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.mode-body { padding: 16px 18px 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; max-width: 900px; }
.mode-body p { max-width: 78ch; } .mode-body ul, .mode-body ol { margin: 0; padding-left: 1.3em; display: grid; gap: 5px; max-width: 78ch; }
.mode-body h4 { font: 700 14px var(--f-d); margin-top: 4px; }
.mode-body .why { border-left: 3px solid var(--accent); background: var(--accent-bg); padding: 10px 14px; border-radius: 0 10px 10px 0; }
.mode-body .review { border-left: 3px solid var(--bad); background: var(--bad-bg); padding: 10px 14px; border-radius: 0 10px 10px 0; }
.mode-body .review b.t { color: var(--bad); }
.json { font: 12px/1.6 var(--f-m); background: var(--code); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; white-space: pre; }
.json .d { background: var(--chg); border-radius: 3px; } .json .mu { color: var(--faint); }
.ops { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.op { flex: 1 1 150px; border: 1px solid var(--line); background: var(--sunk); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; min-width: 0; text-align: left; cursor: pointer; }
.op b { font: 600 12.5px var(--f-m); overflow-wrap: anywhere; } .op span { font-size: 12px; color: var(--soft); }
.op[aria-pressed="true"] { background: var(--teal-bg); border-color: var(--teal); }
.io { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; } @media (max-width: 720px) { .io { grid-template-columns: minmax(0, 1fr); } }
.io div { background: var(--sunk); border-radius: 10px; padding: 10px 12px; font-size: 13px; } .io b { display: block; font: 600 10.5px var(--f-b); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin-bottom: 4px; }
.lin { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 8px; min-width: 1060px; }
.lcard { background: var(--sunk); border-radius: 10px; padding: 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 5px; font-size: 12.5px; align-content: start; }
.lcard .ly { display: flex; justify-content: space-between; gap: 6px; flex-wrap: wrap; font: 600 10.5px var(--f-b); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.lcard b { font: 600 12.5px var(--f-m); overflow-wrap: anywhere; }
.tl-rows { display: grid; gap: 7px; }
.tl-row { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr); gap: 10px; align-items: center; font-size: 13px; }
.tl-row small { display: block; color: var(--faint); font-size: 11.5px; }
.track { position: relative; height: 22px; background: var(--sunk); border-radius: 6px; overflow: hidden; }
.track i { position: absolute; top: 4px; bottom: 4px; border-radius: 4px; } .track .now { top: 0; bottom: 0; width: 2px; background: var(--ink); border-radius: 0; }
.tl-axis { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr); gap: 10px; font: 500 10.5px var(--f-m); color: var(--faint); }
.tl-axis div { position: relative; height: 14px; } .tl-axis div span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.tl-axis div span:first-child { transform: none; } .tl-axis div span:last-child { transform: translateX(-100%); }
@media (max-width: 640px) { .tl-row, .tl-axis { grid-template-columns: minmax(0, 1fr); } .tl-axis > span:first-child { display: none; } }
.tl-state { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 8px; }
.tl-state div { background: var(--sunk); border-radius: 10px; padding: 10px 12px; font-size: 13px; display: grid; gap: 3px; }
.tl-state div.g { background: var(--impl-bg); } .tl-state div.w { background: var(--warn-bg); }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.calc { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; }
.calc label { display: grid; gap: 4px; font-size: 13px; } .calc input { font: 500 14px var(--f-m); padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--sunk); color: var(--ink); }
.out { background: var(--sunk); border-radius: 10px; padding: 10px 12px; } .out b { font: 700 20px var(--f-d); display: block; } .out span { font-size: 12px; color: var(--soft); }
.trace { display: grid; gap: 6px; }
.trace button { display: grid; grid-template-columns: 2em minmax(0, 1fr) auto; gap: 10px; align-items: start; text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.trace button:hover { border-color: var(--teal); }
.trace .n { font: 700 13px var(--f-m); color: var(--accent-ink); } .trace small { display: block; color: var(--soft); font-size: 12.5px; }
.navfoot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* inspector */
.insp { position: fixed; z-index: 40; top: 0; right: 0; bottom: 0; width: min(460px, 100vw); background: var(--paper); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(0,0,0,.14);

step({ g: 2, title: 'Đơn ORD_001 vừa được phân công cho xe VAN-0001. Hệ thống cần ghi nhận những gì?', life: 1,

step({ g: 2, title: 'Xe rời kho và bắt đầu gửi vị trí mỗi 5 giây. GPS nên lưu ở đâu?', life: 2,

    ['Bảng gps_pings trong PostgreSQL vận hành', '', false, '3,5 triệu dòng mỗi ngày đổ vào database của đội vận hành, chỉ để ghi thêm và không bao giờ sửa. Database OLTP sẽ chậm đi cho chính ứng dụng đặt hàng, và vẫn chưa ai được báo khi có ping mới.'],

step({ g: 2, title: 'Xe đã đến nơi. Database có đổi gì không?', life: 4,

  learn: `<p><b>Không.</b> "Đến nơi" là một sự thật của GPS, không phải một sự kiện nghiệp vụ trong database: dòng <code>orders</code> vẫn là <code>out_for_delivery</code>. Đơn chỉ được đóng khi giao xong hoặc thất bại.</p><p>Simulator chỉ đóng đơn ở cuối thời gian dừng tại điểm giao, nên lúc đó xe luôn cách địa chỉ dưới 50 m. Database thì không kiểm tra khoảng cách: nếu ai đó UPDATE sang <code>delivered</code> khi xe còn cách 1 km, Postgres vẫn chấp nhận (DRN-8). Đây là lý do việc ghép GPS với đơn là nghiệp vụ của tầng xử lý, không phải của OLTP.</p>`,

  learn: `<p>Bảng <code>orders</code> giờ chỉ còn <b>trạng thái cuối</b>. Ba trạng thái trước đó đã bị ghi đè. Nếu hỏi "ORD_001 được phân công lúc nào", ta vẫn trả lời được nhờ cột <code>assigned_at</code>. Nhưng nếu hỏi "trước khi đổi, đơn trông thế nào", database không còn biết.</p><p>Và chưa có hệ thống nào được <i>báo</i> rằng đơn vừa giao xong. Dashboard chỉ biết nếu tự đi hỏi database.</p>`,

step({ g: 3, title: 'Database đã có dữ liệu, nhưng dashboard không biết khi nào có thay đổi. Lấy thay đổi ra bằng cách nào?', life: 5,
  ctx: 'Trong lần chạy thật, simulator ghi 4 thay đổi của ORD_001 trong vòng 1,2 giây (commit lúc 03:25:34.672Z và 03:25:35.857Z).',
  panes: ['pgrow'], intro: ['pg', 'sim', 'gpsout'], hot: ['pg'],
  quiz: { q: 'Cách đưa thay đổi của orders ra ngoài:', opts: [
    ['Polling: SELECT … WHERE updated_at > :lần_trước, mỗi 5 giây', '', false, 'Lần poll kế tiếp chỉ thấy dòng hiện tại là delivered: ba trạng thái trung gian biến mất, cùng với giá trị cũ. Mỗi lần poll cũng là một query lên database của đội khác; delete không thấy được; và không biết thứ tự commit thật.'],
    ['Ghi kép: ứng dụng vừa UPDATE database vừa gửi Kafka', '', false, 'Không có giao dịch chung giữa hai hệ thống. Nếu UPDATE xong mà tiến trình chết trước khi gửi, database ghi delivered còn stream mãi mãi không biết. Nếu gửi trước rồi UPDATE bị rollback, stream có một sự kiện chưa từng xảy ra.'],
    ['CDC: đọc thay đổi từ nhật ký giao dịch (WAL) của Postgres', '', true, 'Đúng (ADR 0004). Mọi thay đổi đã commit đều có trong WAL theo đúng thứ tự, kèm cả dòng trước và sau. Ứng dụng nguồn không phải sửa gì. Chi phí: phải vận hành một replication slot, và nếu nó bị bỏ rơi thì WAL tích tụ.'],
  ] },
  learn: `<p>Database UPDATE thì Kafka không tự biết. Cần một cơ chế <b>bắt thay đổi</b> (Change Data Capture). Có ba cách, và hai cách đầu hỏng theo những kiểu khó nhận ra.</p><p>Nếu ứng dụng nhất định phải tự phát event, mẫu đúng là <b>outbox</b>: ghi event vào một bảng trong <i>cùng giao dịch</i> với UPDATE, rồi dùng CDC đọc bảng đó. Outbox nằm ngoài phạm vi spec 002.</p>`,
  explore: () => `<h4>Cùng 4 thay đổi, ba cách quan sát</h4><table class="mt"><tr><th>Thay đổi</th><th>CDC</th><th>Polling 5 s</th><th>Ghi kép (crash sau UPDATE thứ 4)</th></tr><tr><td>created</td><td>✓ lsn 27101288</td><td>✕</td><td>✓</td></tr><tr><td>assigned</td><td>✓ lsn 27187680</td><td>✕</td><td>✓</td></tr><tr><td>out_for_delivery</td><td>✓ lsn 27390824</td><td>✕</td><td>✓</td></tr><tr><td>delivered</td><td>✓ lsn 27586392</td><td>✓ (chỉ trạng thái cuối)</td><td>✕ database có, stream không</td></tr></table>`,
  build: `<pre><span class="c"># docs/decisions/0004-cdc-postgres-debezium.md</span>
Decision: The simulator writes orders to Postgres. Debezium (Kafka Connect, pgoutput logical
replication) publishes changes to cdc.public.orders.</pre>` });
step({ g: 3, title: 'UPDATE được ghi vào WAL. Debezium đọc nó thế nào?', life: 5,
  ctx: 'Mỗi giao dịch commit được ghi vào WAL ở một vị trí gọi là LSN. Debezium giữ một replication slot để Postgres không xóa WAL trước khi nó đọc xong.',
  panes: ['pgrow', 'cdc'], intro: ['pg', 'sim', 'gpsout', 'dbz'], hot: ['pg', 'dbz', 'pg>dbz'],
  learn: `<ol><li><b>UPDATE</b> chạy trong giao dịch txid 1855.</li><li><b>Commit:</b> Postgres ghi thay đổi vào <b>WAL</b> (Write-Ahead Log), tại LSN 27586392. Nhờ <code>REPLICA IDENTITY FULL</code>, WAL chứa cả dòng cũ.</li><li><b>Replication slot</b> <code>ct_cdc_slot</code> là con trỏ bền: Postgres giữ WAL cho tới khi slot xác nhận đã đọc (giới hạn 1 GB).</li><li><b>Debezium</b> giải mã bằng <code>pgoutput</code> và dựng một <b>envelope</b>: <code>op</code>, <code>before</code>, <code>after</code>, <code>source</code> (lsn, txId, thời điểm commit).</li></ol><p>Chế độ Explore cho thấy envelope thật của sự kiện đang chọn ở cột trái.</p>`,
  explore: () => envelopeBox(), build: () => compTab('dbz', 0) });
step({ g: 3, title: 'Message cần một nơi để chờ người đọc. Key nên là gì?', life: 0,
  ctx: 'Redpanda (nói giao thức Kafka) nhận cả hai luồng: GPS ở topic gps.pings.v1, CDC ở topic cdc.public.orders. Mỗi topic có 3 partition, giữ 7 ngày. Dùng nút "Sự kiện tiếp" ở cột trái để thấy mỗi thay đổi đi qua cả chuỗi.',
  panes: ['biz', 'map', 'pgrow', 'cdc', 'rp'], intro: ['pg', 'sim', 'dbz', 'rp'], hot: ['rp', 'dbz>rp', 'sim>rp'],
  quiz: { q: 'Message key của luồng GPS nên là:', opts: [
    ['Không có key: chia đều cho các partition', '', false, 'Hai ping liên tiếp của một xe có thể rơi vào hai partition khác nhau và bị đọc ngược thứ tự. "Vị trí mới nhất" sẽ sai.'],
    ['vehicle_id', '', true, 'Đúng. Mọi ping của VAN-0001 vào cùng một partition (thực tế: partition 0) và giữ đúng thứ tự. 200 xe chia vào 3 partition vẫn đều. Với CDC, Debezium tự dùng khóa chính {"order_id": …} làm key, cùng lý do.'],
    ['order_id', '', false, 'Ping GPS không có order_id; một xe chở 13 đơn cùng lúc.'],
  ] },
  learn: `<p>Một <b>topic</b> là một luồng message có tên. Nó chia thành <b>partition</b>; thứ tự chỉ được đảm bảo trong một partition. Mỗi message có một <b>offset</b>, là số thứ tự trong partition đó.</p><p>Offset <b>không phải</b> ID nghiệp vụ: chạy lại pipeline thì offset đổi. Kafka giữ message 7 ngày, bất kể đã có ai đọc chưa, nên nhiều consumer đọc được độc lập, và đọc lại được.</p><div class="why"><b>Thử ngay:</b> bấm "Sự kiện tiếp" ở cột trái. Mỗi thay đổi của ORD_001 xuất hiện đồng thời ở PostgreSQL, ở CDC và ở Redpanda, với offset thật 126 → 180 → 279 → 381.</div>`,
  explore: () => `<h4>Partition và offset thật</h4><table class="mt"><tr><th>Topic</th><th>Partition</th><th>Offset</th><th>Nội dung</th></tr>${EV.filter(e => e.cdc).map(e => `<tr><td>cdc.public.orders</td><td>0</td><td>${e.cdc.off}</td><td>op=${e.cdc.op} · ${e.cdc.ast}</td></tr>`).join('')}${EV.filter(e => e.gps).map(e => `<tr><td>gps.pings.v1</td><td>0</td><td>${e.gps.off}</td><td>VAN-0001 @ ${e.gps.ts}</td></tr>`).join('')}</table>`,
  build: () => compTab('rp', 1) });

step({ g: 4, title: 'Flink đã đọc message delivered. Nhưng Trino chưa thấy nó. Vì sao?', life: 5, commit: 4,
  ctx: 'Flink đọc từ Redpanda và ghi vào bảng Iceberg. Thay đổi cuối cùng của ORD_001 đã nằm trong file Parquet, nhưng chưa được commit. Bấm "Chạy checkpoint" ở cột trái.',
  panes: ['rp', 'flink', 'ice', 'trino'], intro: ALL_LOCAL, hot: ['flink', 'ice', 'rp>flink', 'flink>ice'],
  learn: `<p>Một <b>Flink job</b> là một chương trình chạy liên tục. Project có hai job viết bằng Flink SQL: <code>bronze_gps</code> và <code>bronze_cdc</code>. Mỗi job là: một bảng nguồn đọc Kafka, một catalog Iceberg làm đích, và một câu <code>INSERT INTO … SELECT …</code>.</p><p>Writer ghi row vào file Parquet ngay, nhưng file chưa thuộc snapshot nào nên không ai đọc được. Mỗi 30 giây, <b>checkpoint</b> chụp lại offset đang đọc và trạng thái writer. Chỉ khi checkpoint thành công, <code>IcebergFilesCommitter</code> mới tạo snapshot mới, và dữ liệu hiện ra trong Trino. Nhờ đi cùng checkpoint nên không mất và không trùng (exactly-once từ Kafka vào Iceberg).</p><p><b>Event time và processing time:</b> <code>event_ts</code> là lúc thiết bị đo; processing time là lúc Flink xử lý. Trong lần chạy history, ping 01:02:05Z tới Kafka lúc 03:25:35.771Z.</p>`,
  explore: () => opsBox(), build: () => compTab('flink', 0) });
step({ g: 4, title: 'Đọc Flink Dashboard: mỗi operator đang làm gì?', life: 5,
  ctx: 'Mở http://localhost:8081 → Running Jobs. Kế hoạch dưới đây lấy từ REST API của Flink trên stack thật.',
  panes: ['flink', 'ice', 'trino'], intro: ALL_LOCAL, hot: ['flink', 'rp>flink', 'flink>ice'],
  learn: `<ul><li><b>Sơ đồ</b> có 2 khối: Flink gộp (chain) Source → Calc → IcebergStreamWriter thành một khối chạy chung thread; IcebergFilesCommitter là khối riêng.</li><li>Bấm vào khối để xem <b>Records Received / Sent</b>.</li><li>Tab <b>Checkpoints</b>: số thật của <code>bronze_gps</code> là 126 thành công / 127 lần (1 lần fail); <code>bronze_cdc</code> 126/126.</li><li>Tab <b>BackPressure</b>: operator nào đang nghẽn. Khi chạy lại 100 triệu event (giai đoạn 7), đây là nơi đầu tiên cần nhìn.</li></ul><p><b>Watermark</b> (<code>event_ts − 30 s</code>) được khai báo ở mọi source, nhưng chỉ có tác dụng với operator theo event time (window, join theo thời gian). Job bronze không có operator nào như vậy, nên event đến trễ vẫn được ghi đủ.</p>`,
  explore: () => opsBox(), build: `<pre>curl -s localhost:8081/jobs/overview
<span class="c">#  bronze_gps RUNNING · bronze_cdc RUNNING</span>
curl -s localhost:8081/jobs/&lt;jid&gt;/checkpoints
<span class="c">#  {"counts": {"total": 127, "completed": 126, "failed": 1, ...}}</span></pre>` });

step({ g: 5, title: 'Connector bị crash và gửi lại một thay đổi. Đếm số đơn đã giao còn đúng không?', life: 5, chaos: 'dup',
  ctx: 'Debezium là at-least-once: sau khi crash, nó có thể gửi lại thay đổi cuối. Dòng màu đỏ trong Redpanda và bronze là proposed example: cùng LSN 27586392 nhưng offset mới 412.',
  panes: ['rp', 'ice', 'trino'], intro: ALL_LOCAL, hot: ['ice', 'trino', 'ice>trino'],
  quiz: { q: 'Khóa nào nhận ra đúng một thay đổi CDC, để khử trùng?', opts: [
    ['kafka_offset', '', false, 'Bản gửi lại có offset mới (412 thay vì 381), nên trông như một thay đổi khác. Offset là vị trí trong log, không phải danh tính của thay đổi.'],
    ['source_lsn', '', false, 'Gần đúng nhưng không đủ: mọi bản ghi snapshot dùng chung một LSN. Trên stack thật, cả 200 dòng snapshot của vans có cùng LSN 26780256 (DRN-7).'],
    ['(order_id, source_lsn, op)', 'Khóa chính của dòng + vị trí WAL + loại thay đổi.', true, 'Đúng. Bản gửi lại có cùng bộ ba nên bị loại; 200 dòng snapshot có cùng LSN nhưng khác khóa chính nên vẫn được giữ.'],
  ] },
  learn: `<p>Bronze cố ý <b>giữ mọi thứ</b>, kể cả bản trùng: nó là bản ghi trung thực của những gì đã nhận, kèm metadata (offset, LSN, ingest_ts) để truy vết. Vì vậy câu <code>count(*) WHERE after.status = 'delivered'</code> trên bronze trả về <b>2</b> cho một đơn.</p><p>Tầng <b>silver</b> tồn tại để giải quyết đúng chuyện này: khử trùng theo khóa nghiệp vụ, và chỉ giữ bản mới nhất theo thứ tự LSN.</p>`,
  explore: () => `<h4>Câu đếm ngây thơ trên bronze</h4><pre>SELECT count(*) FROM lakehouse.bronze.orders_cdc
WHERE after.order_id = 'ORD-20261118-00001' AND after.status = 'delivered';
<span class="c">-- 2   ← sai, chỉ có 1 lần giao</span></pre><h4>Sau khi khử trùng <span class="st ex">Proposed example</span></h4><pre>SELECT count(*) FROM (SELECT DISTINCT after.order_id, source_lsn, op
  FROM lakehouse.bronze.orders_cdc
  WHERE after.status = 'delivered' AND after.order_id = 'ORD-20261118-00001');
<span class="c">-- 1</span></pre>`,
  build: `<p>Silver chưa có code (feature 4). Quy tắc đã ghi ở <code>docs/requirements.md</code> mục 3: mọi bảng phải khai báo grain, khóa khử trùng và khóa thứ tự; offset không bao giờ là khóa.</p>` });
step({ g: 5, title: 'Một ping đến sai thứ tự. Xe đang ở đâu?', life: 5, chaos: 'ooo',
  ctx: 'Ping lúc 08:02:05 (xe còn cách 1,3 km) bị gửi lại và tới sau ping 08:09:05 (xe ở nhà khách). Nếu lấy "ping nhận được sau cùng" làm vị trí hiện tại thì sao?',
  panes: ['map', 'silver'], intro: ALL_LOCAL.concat(['silver']), hot: ['silver', 'ice>silver'],
  learn: `<p>"Sau cùng" có hai nghĩa: sau cùng <b>theo lúc nhận</b> (ingest_ts) và sau cùng <b>theo lúc đo</b> (event_ts). Lấy theo lúc nhận, xe "lùi" về chỗ cách 1,3 km, ngay sau khi đã giao xong. Phải lấy theo event_ts.</p><p>Silver GPS có grain "một ping duy nhất", khóa khử trùng <code>(vehicle_id, event_ts)</code>, partition <code>day(event_ts)</code> + <code>bucket(16, vehicle_id)</code>. Với CDC, thứ tự xác định bằng LSN, không phải thứ tự message tới.</p>`,
  explore: () => `<pre><span class="c">-- sai: lấy theo lúc nhận</span>
SELECT * FROM bronze.gps_pings WHERE vehicle_id = 'VAN-0001' ORDER BY ingest_ts DESC LIMIT 1;
<span class="c">--  event_ts 01:02:05Z · cách 1.328 m   ← vị trí cũ</span>

<span class="c">-- đúng: theo lúc đo, sau khi khử trùng (Proposed example)</span>
SELECT * FROM (SELECT *, row_number() OVER (PARTITION BY vehicle_id, event_ts ORDER BY ingest_ts) rn
  FROM bronze.gps_pings) WHERE rn = 1 AND vehicle_id = 'VAN-0001' ORDER BY event_ts DESC LIMIT 1;
<span class="c">--  event_ts 01:09:05Z · cách 6 m</span></pre>`,
  build: `<p>Bảng serving <code>vehicle_latest</code> (feature 6) sẽ chỉ ghi đè khi ping mới hơn theo <code>event_ts</code>.</p>` });
step({ g: 5, title: 'KPI cần một dòng cho mỗi cái gì?', life: 5,
  ctx: 'Ops manager hỏi tỉ lệ đúng giờ theo kho và ngày. Hãy chọn grain cho bảng fact ở tầng gold.',
  panes: ['silver', 'gold'], intro: ALL_LOCAL.concat(['silver', 'gold']), hot: ['gold', 'silver>gold'],
  quiz: { q: 'Grain của gold.fct_delivery:', opts: [
    ['Một dòng cho mỗi thay đổi CDC', '', false, 'ORD_001 sẽ có 4 dòng. Đếm số đơn thành đếm số thay đổi.'],
    ['Một dòng cho mỗi đơn đã đóng (giao xong hoặc thất bại)', '', true, 'Đúng. Đơn đã đóng mới có kết quả đúng hay trễ. Các chỉ số (is_on_time, minutes_late, sai số ETA) gắn với đúng một đơn. Tổng hợp theo kho và ngày là một bảng khác (agg_depot_daily).'],
    ['Một dòng cho mỗi xe mỗi ngày', '', false, 'Đó là một bảng tổng hợp. Nếu chọn làm fact thì mất chi tiết từng đơn, không trả lời được "đơn nào trễ".'],
  ] },
  learn: `<p>Ở mỗi tầng, ORD_001 có số dòng khác nhau:</p><table class="mt"><tr><th>Bảng</th><th>Một dòng là</th><th>Số dòng của ORD_001</th></tr><tr><td>orders (OLTP)</td><td>trạng thái hiện tại</td><td>1</td></tr><tr><td>bronze.orders_cdc</td><td>một thay đổi đã nhận</td><td>4 (có thể hơn nếu trùng)</td></tr><tr><td>silver.orders</td><td>trạng thái mới nhất hợp lệ</td><td>1</td></tr><tr><td>silver.order_status_history</td><td>một lần đổi trạng thái</td><td>4</td></tr><tr><td>gold.fct_delivery</td><td>một đơn đã đóng</td><td>1</td></tr></table><div class="review"><b class="t">Join sai grain.</b> <code>fct_delivery JOIN bronze.orders_cdc</code> cho ra 4 dòng cho mỗi đơn, nên số đơn đợt sáng của VAN-0001 thành 13 × 4 = 52. <code>gps_pings JOIN orders ON van_id</code> làm mỗi ping khớp với 25 đơn của xe trong ngày; ngay cả khi chỉ lấy đơn đang giao vẫn còn 13. Muốn biết đơn xe đang hướng tới, phải dùng ngữ cảnh phân công: đơn có stop_seq nhỏ nhất trong các đơn đang mở của xe tại thời điểm đó.</div>`,
  explore: () => lineageBox(), build: `<pre><span class="c">-- Proposed example (feature 7): gold.fct_delivery từ silver.orders</span>
SELECT order_id,
       date(coalesce(delivered_at, failed_at) AT TIME ZONE 'Asia/Ho_Chi_Minh') AS local_date,
       status = 'delivered' AND delivered_at &lt;= promised_end AS is_on_time,   <span class="c">-- BR-2: failed = không đúng giờ</span>
       ...
FROM silver.orders WHERE status IN ('delivered', 'failed');</pre><p class="note">Ngày tính theo giờ Việt Nam (BR-4): một đơn giao lúc 00:30 giờ VN có ngày UTC là hôm trước.</p>` });

const FULL = ALL_LOCAL.concat(['silver', 'gold', 'fct', 'serving']);
step({ g: 6, title: 'VAN-0009 mất sóng 5 giờ rồi gửi bù 3.600 ping. Hệ thống phản ứng thế nào?', life: 5, widget: 'offline',
  ctx: 'Thiết bị vẫn đo và lưu đệm từ 09:00 tới 14:00; có sóng lại thì gửi hết. Đây là proposed example: simulator chưa có chế độ mất sóng (chaos mode là feature 4). Kéo đồng hồ trong chế độ Explore.',
  panes: [], intro: FULL, hot: ['fct', 'gold', 'rp>fct'],
  learn: `<p>Đây là chỗ freshness và correctness va nhau (ADR 0006):</p><ul><li><b>Cảnh báo (Flink control tower, designed):</b> cần trả lời trong vài giây. Ping cũ hơn alert horizon (10 phút, proposed) chỉ cập nhật vị trí, không bắn cảnh báo cho quá khứ.</li><li><b>Bronze:</b> ghi đủ cả 3.600 ping ở checkpoint kế tiếp.</li><li><b>KPI tạm tính (dbt mỗi 5 phút, nhìn lại 2 giờ):</b> không sửa được giờ 09:00–12:05.</li><li><b>Chốt sổ 01:00:</b> tính lại cả ngày, nên số chính thức đúng.</li></ul><p>Vì vậy cảnh báo dùng Flink (nhanh, chấp nhận sai nhẹ) còn KPI dùng dbt (chậm vài phút, nhưng đúng).</p>`,
  explore: () => offlineBox(), build: `<p>Chưa có code: control tower là feature 6, dbt là feature 7. Quyết định nằm ở <code>docs/decisions/0006-stream-freshness-batch-correctness.md</code>; RPO/RTO và alert horizon là NFR-3/NFR-4 (proposed) trong <code>docs/requirements.md</code>.</p>` });
step({ g: 6, title: '01:00 đêm: chốt sổ. Event đến sau đó thì sao?', life: 5, final: true,
  ctx: 'dbt tính lại toàn bộ ngày 18/11 từ silver, đánh dấu is_final = true, ghi một dòng vào closed_days.',
  panes: ['gold'], intro: FULL, hot: ['gold', 'silver>gold'],
  learn: `<p><b>Batch reconciliation</b> (đối soát) đọc lại dữ liệu <i>đã nằm trong</i> silver để sửa KPI. Mục tiêu là độ đúng, và nó không đụng tới Kafka hay Flink.</p><p>Chạy lại cho cùng kết quả: job đêm <b>ghi đè cả partition</b> của ngày cần chốt. Event đến sau 01:00 vẫn được lưu ở bronze và silver, nhưng không tự đổi số đã chốt: chúng được đếm vào <code>late_after_close</code>. Chỉ lệnh <code>make reclose DAY=…</code> (restatement có dấu vết) mới sửa được số đã chốt.</p>`,
  explore: () => `<table class="mt"><tr><th>Thời điểm</th><th>fct_delivery của ORD_001 <span class="st ex">Proposed example</span></th></tr><tr><td>08:10 (lần dbt đầu tiên)</td><td>is_on_time = true · is_final = false</td></tr><tr><td>01:00 ngày 19/11</td><td>is_on_time = true · is_final = <b>true</b></td></tr></table><p class="note">Dashboard phải cho người xem biết một con số là tạm tính hay đã chốt (câu hỏi mở số 3 trong requirements.md).</p>`,
  build: `<p>Chưa có code (feature 7). Mô hình dữ liệu: <code>gold.closed_days</code> (local_date, closed_at, late_events_absorbed, late_after_close) trong <code>docs/requirements.md</code> mục 4.</p>` });
step({ g: 6, title: 'Chạy lại 100 triệu event để chứng minh thiết kế chịu tải. Có khác gì đối soát không?', life: 5, widget: 'bench', final: true,
  ctx: '200 xe × 1 ping / 5 giây là khoảng 3,5 triệu ping mỗi ngày; 30 ngày là khoảng 100 triệu. Luồng live chỉ 40 event/s, quá nhẹ để thử tải. Phép thử thật là đẩy lại lịch sử qua đúng đường Kafka → Flink.',
  panes: [], intro: FULL, hot: ['rp', 'flink', 'sim>rp', 'rp>flink'],
  learn: `<p><b>Replay benchmark</b> (ADR 0009, feature 5) khác hẳn đối soát:</p><table class="mt"><tr><th></th><th>Batch reconciliation</th><th>Replay benchmark</th></tr><tr><td>Mục tiêu</td><td>Độ đúng của KPI</td><td>Năng lực xử lý (throughput)</td></tr><tr><td>Đường dữ liệu</td><td>silver → dbt → gold</td><td>simulator → Kafka → Flink → Iceberg</td></tr><tr><td>Khi nào chạy</td><td>Mỗi đêm</td><td>Khi cần đo</td></tr></table><p>Khi replay, event time chạy nhanh hơn đồng hồ thật rất nhiều, nên watermark cũng tiến rất nhanh. Partition chậm hoặc rỗng có thể làm watermark đứng lại (cần cấu hình idleness). Cảnh báo cho event cũ phải bị chặn bằng alert horizon. Watermark không tự xử lý đúng mọi kiểu replay. Kafka đóng vai bộ đệm; consumer lag và tab BackPressure cho biết Flink có theo kịp không.</p>`,
  explore: () => benchBox(), build: `<p>Chưa có code (feature 5): <code>make backfill DAYS=30</code> và <code>make bench</code> mới chỉ có trong README và ADR 0009.</p>` });

step({ g: 7, title: 'Chạy toàn bộ trên máy bạn và kiểm chứng bằng SQL', life: 5,
  ctx: 'Một lệnh dựng stack; simulator sinh dữ liệu; mỗi thành phần có cách kiểm tra riêng. Thứ tự khởi động do các điều kiện depends_on trong docker-compose lo; chạy riêng một câu SQL không làm cả hệ thống hoạt động.',
  panes: ['pgrow', 'rp', 'ice', 'trino'], intro: ALL_LOCAL, hot: ['pg', 'dbz', 'rp', 'flink', 'ice', 'trino', 'pg>dbz', 'dbz>rp', 'rp>flink', 'flink>ice', 'ice>trino', 'sim>pg', 'sim>rp'],
  learn: `<ol><li><code>docker login dhi.io</code> (một lần, để kéo image MinIO hardened).</li><li><code>make up</code>: dựng MinIO, Redpanda và topic, Iceberg catalog, Trino và DDL bronze, Postgres, Kafka Connect và connector, Flink và 2 job. Khoảng 1 phút nếu image đã có sẵn.</li><li><code>uv run python -m simulator day --vans 20 --history-hours 3</code></li><li>Kiểm tra từng chặng (chế độ Build).</li><li><code>make e2e</code>: 10 test nghiệm thu; <code>make e2e-restart</code>: test khởi động lại.</li></ol><p>Bấm vào từng thành phần trên sơ đồ để mở inspector: schema, code, cấu hình, metrics, ADR và test.</p>`,
  explore: () => traceBox(), build: `<pre>make up
make cdc-status                       <span class="c"># connector RUNNING · slot lag ~25 kB</span>
docker compose -f infra/local/docker-compose.yml exec redpanda \\
  rpk topic consume cdc.public.orders --offset start -f '%p %o %k\\n' | grep 00001
curl -s localhost:8081/jobs/overview  <span class="c"># bronze_gps, bronze_cdc RUNNING</span>
docker compose -f infra/local/docker-compose.yml exec trino trino

  }

}

function compTab(id, k) { const t = COMP[id].tabs[k][1]; return typeof t === 'function' ? t() : t; }

const DRN = [['DRN-1', 'Spec vẽ đường DLQ nhưng chưa có; JSON hỏng làm dừng job Flink.'], ['DRN-2', 'Profile Compose khác ADR 0005 (ADR: core/cdc/ui; thực tế: cdc, jobs).'], ['DRN-3', 'ADR 0001/0002/0008 nhắc "feature 8" là AWS; giờ là feature 10.'], ['DRN-4', 'Job e2e trên CI chưa từng chạy (thiếu secret Docker Hub).'], ['DRN-5', 'requirements.md vẫn Draft sau khi merge PR #3.'], ['DRN-6', 'CLAUDE.md ghi timestamp(3); bronze lưu timestamp(6).'], ['DRN-7', 'LSN không luôn duy nhất: 200 dòng snapshot vans chung LSN 26780256. Khóa khử trùng: (khóa chính, source_lsn, op).'], ['DRN-8', 'Database không ép: xe cùng kho với đơn, thứ tự trạng thái, giao khi ở gần.'], ['DRN-9', 'OLTP không lưu lịch sử phân công; chỉ CDC còn giữ.'], ['DRN-10', 'bronze.orders_cdc partition theo ngày commit; KPI phải dùng ngày nghiệp vụ.'], ['DRN-11', 'Ở chế độ history, commit_ts muộn hơn thời gian nghiệp vụ hàng giờ.'], ['DRN-12', 'Khóa (order_id, status) cho history giả định mỗi trạng thái chỉ một lần.'], ['DRN-13', 'Topic heartbeat Debezium được tự tạo; trên MSK cần tạo trước.']];
$('drnBtn').addEventListener('click', () => openInspector('Design review', '13 chỗ lệch hoặc điểm yếu, chờ chủ project quyết định', [['Notes', `<div class="drn">${DRN.map(d => `<div><b class="id">${d[0]}</b>${esc(d[1])}</div>`).join('')}</div>`]]));

/* ---- inspector ---- */
let lastFocus = null;
function openInspector(title, sub, tabs, status) {
  lastFocus = document.activeElement;
  $('iTitle').innerHTML = esc(title) + (status ? ' ' + badge(status) : '');
  $('iSub').textContent = sub || '';
  let cur = 0;
  const draw = () => {
    $('iTabs').innerHTML = tabs.map((t, k) => `<button role="tab" type="button" data-k="${k}" aria-selected="${k === cur}">${t[0]}</button>`).join('');
    $('iTabs').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { cur = Number(b.dataset.k); draw(); }));
    const c = tabs[cur][1]; $('iBody').innerHTML = typeof c === 'function' ? c() : c;
  };
  draw();
  $('insp').classList.add('open'); $('insp').setAttribute('aria-hidden', 'false'); document.body.classList.add('insp-on');
  $('iClose').focus({ preventScroll: true });
}
function closeInspector() { $('insp').classList.remove('open'); $('insp').setAttribute('aria-hidden', 'true'); document.body.classList.remove('insp-on'); if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true }); }
$('iClose').addEventListener('click', closeInspector);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('insp').classList.contains('open')) { closeInspector(); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === 'ArrowRight' && e.altKey) enterStep(state.i + 1);
  if (e.key === 'ArrowLeft' && e.altKey) enterStep(state.i - 1);
});

/* ---- wiring ---- */
$('prev').addEventListener('click', () => enterStep(state.i - 1));
$('next').addEventListener('click', () => enterStep(state.i + 1));
$('tlToggle').addEventListener('click', () => { const on = $('tl').classList.toggle('show-all'); $('tlToggle').setAttribute('aria-expanded', String(on)); });
const m = /^#step-(\d+)$/.exec(location.hash);
enterStep(m ? Number(m[1]) - 1 : 0);
})();
</script>
