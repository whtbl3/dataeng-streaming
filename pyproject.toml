[project]
name = "delivery-control-tower"
version = "0.1.0"
description = "Real-time last-mile delivery tracking on a streaming lakehouse (Kafka, Flink, Iceberg, dbt) on AWS."
readme = "README.md"
requires-python = ">=3.11,<3.12" # PyFlink supports up to 3.11 (ADR 0002)
dependencies = []

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
